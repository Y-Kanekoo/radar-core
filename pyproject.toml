[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "radar-core"
version = "0.1.0"
description = "RSS収集・正規化・Discord通知の共有ライブラリ"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.28,<1", "feedparser>=6.0,<7"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-cov>=6", "pytest-socket>=0.7", "ruff>=0.11", "mypy>=1.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/radar_core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket --cov=radar_core --cov-branch --cov-report=term-missing --cov-fail-under=85"

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true
